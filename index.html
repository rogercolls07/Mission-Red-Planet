<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Comunicaciones - Planeta Rojo</title>
    
    <link rel="stylesheet" href="css/style.css">
    <script defer src="src/comm.js"></script>
    <script defer src="src/main.js"></script>
    
</head>
<body>

    <div class="control-panel">
        <h1>Módulo de Comunicaciones (Tierra)</h1>
        
        <div class="form-group">
            <label for="msg">Mensaje a transmitir:</label>
            <input type="text" id="msg" placeholder="Ej: Permiso para iniciar secuencia...">
        </div>

        <div class="atm-conditions">
            <div class="form-group" style="flex: 1;">
                <label for="pressure">Presión (kPa):</label>
                <input type="number" id="pressure" placeholder="101.3" step="0.1">
            </div>

            <div class="form-group" style="flex: 1;">
                <label for="humidity">Humedad (%):</label>
                <input type="number" id="humidity" placeholder="45" min="0" max="100">
            </div>
        </div>

        <div class="button-group">
            <button id="btn-encode">Codificar</button>
            <button id="btn-frequency">Frecuencia</button>
            <button id="btn-sign">Firmar</button>
        </div>

        <div class="output-panel">
            <label>> TERMINAL_DE_SALIDA:</label>
            <output id="out">Esperando comandos...</output>
        </div>
    </div>

   
    
</body>
</html>
